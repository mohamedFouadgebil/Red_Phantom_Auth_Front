<!doctype html>
<html>
  <head>
    <title>Verify Email | Red Phantom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="icon" href="./assets/images/Red Phantom.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #070b17;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .bg-grid {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(#ffffff08 1px, transparent 1px),
          linear-gradient(90deg, #ffffff08 1px, transparent 1px);
        background-size: 45px 45px;
        z-index: -1;
      }
      .auth-container {
        width: 90%;
        max-width: 400px;
        padding: 40px 25px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        text-align: center;
        box-sizing: border-box;
      }
      .logo {
        width: 80px;
        height: auto;
        margin-bottom: 20px;
      }
      h2 {
        color: #fff;
        margin-bottom: 30px;
        font-size: 1.8rem;
      }
      input {
        width: 100%;
        padding: 14px;
        margin-bottom: 20px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: #fff;
        font-size: 16px;
        box-sizing: border-box;
        outline: none;
        display: block;
        text-align: center;
        letter-spacing: 4px;
      }
      input:focus {
        border-color: #ff003c;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #ff003c;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        display: block;
      }
      button:hover {
        background: #cc002f;
        transform: translateY(-2px);
      }
      @media (max-width: 480px) {
        .auth-container {
          width: 85%;
          padding: 30px 20px;
        }
        h2 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>

    <div class="auth-container">
      <img src="./assets/images/Red Phantom.png" class="logo" />
      <h2>Email Verification</h2>

      <input id="otp" placeholder="Enter OTP Code" />

      <button onclick="verifyEmail()">Verify</button>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
