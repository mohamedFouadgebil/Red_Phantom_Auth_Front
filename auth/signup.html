<!doctype html>
<html>
  <head>
    <title>Signup | Red Phantom</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="icon" href="./assets/images/Red Phantom.png" />
    <style>
      body {
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: #070b17;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .bg-grid {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image:
          linear-gradient(#ffffff08 1px, transparent 1px),
          linear-gradient(90deg, #ffffff08 1px, transparent 1px);
        background-size: 45px 45px;
        z-index: -1;
      }
      .auth-container {
        width: 90%;
        max-width: 450px;
        padding: 30px 25px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        backdrop-filter: blur(10px);
        text-align: center;
        box-sizing: border-box;
        margin: 20px 0;
      }
      .logo {
        width: 70px;
        height: auto;
        margin-bottom: 15px;
      }
      h2 {
        color: #fff;
        margin-bottom: 25px;
        font-size: 1.6rem;
      }
      input,
      select {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 6px;
        color: #fff;
        font-size: 15px;
        box-sizing: border-box;
        outline: none;
        display: block;
      }
      option {
        background: #070b17;
        color: #fff;
      }
      input:focus,
      select:focus {
        border-color: #ff003c;
      }
      .radio-group {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-bottom: 20px;
        color: #fff;
      }
      .radio-group label {
        display: flex;
        align-items: center;
        cursor: pointer;
        font-size: 15px;
      }
      .radio-group input {
        width: auto;
        margin: 0 8px 0 0;
        cursor: pointer;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #ff003c;
        border: none;
        border-radius: 6px;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
        display: block;
      }
      button:hover {
        background: #cc002f;
        transform: translateY(-2px);
      }
      .link {
        margin-top: 20px;
      }
      .link a {
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        font-size: 14px;
      }
      .link a:hover {
        color: #ff003c;
      }
      @media (max-width: 480px) {
        .auth-container {
          width: 92%;
          padding: 25px 15px;
        }
        h2 {
          font-size: 1.4rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-grid"></div>

    <div class="auth-container">
      <img src="./assets/images/Red Phantom.png" class="logo" />
      <h2>Create Account</h2>

      <input id="firstName" placeholder="First Name" />
      <input id="lastName" placeholder="Last Name" />
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <input
        id="confirmPassword"
        type="password"
        placeholder="Confirm Your Password"
      />
      <input id="age" type="number" placeholder="Age (18+)" />
      <input id="phone" placeholder="Phone" />

      <select id="role">
        <option value="USER">User</option>
        <!-- <option value="ADMIN">Admin</option> -->
      </select>

      <div class="radio-group">
        <label
          ><input type="radio" name="gender" value="MALE" checked /> Male</label
        >
        <label
          ><input type="radio" name="gender" value="FEMALE" /> Female</label
        >
      </div>

      <button onclick="signup()">Sign Up</button>

      <div class="link">
        <a href="login.html">Already have an account?</a>
      </div>
    </div>

    <script src="auth.js"></script>
  </body>
</html>
